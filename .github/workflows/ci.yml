name: ci

on:
  push:
    # Agent branches get CI before they are merged (one branch per task).
    branches: [main, 'claude/**', 'codex/**']
  pull_request:

jobs:
  core:
    name: Go core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./internal/... ./cmd/...
      - run: go test -race -count=1 ./internal/... ./cmd/...

  cross:
    name: Cross-compile core (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [windows/amd64, darwin/arm64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and vet
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go build -o /dev/null ./internal/... ./cmd/...
          go vet ./internal/... ./cmd/...

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./internal/... ./cmd/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    name: Wails build (macOS)
    runs-on: macos-latest
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - run: wails doctor
      # The root package embeds frontend/dist, so the frontend must exist
      # before the Go package can compile for the bindings check.
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
      - name: Bindings are up to date
        run: |
          wails generate module
          git diff --exit-code -- frontend/wailsjs/go
      - run: wails build -skipbindings
      - uses: actions/upload-artifact@v7
        with:
          name: agent-forum-macos
          path: build/bin
          if-no-files-found: error
